name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-cli:
    name: Rust CLI (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets

  trainer-python:
    name: Trainer and scripts (pytest, no torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install trainer with dev extra only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "trainer[dev]"
      - name: Run trainer tests
        run: python -m pytest -q
        working-directory: trainer
      - name: Run scripts tests
        run: python -m pytest -q scripts/test_scripts.py
