[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fineforge-train"
version = "0.1.0"
description = "LoRA/QLoRA training, adapter merging and benchmarking for FineForge"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "iboondk" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
train = [
  "torch",
  "transformers>=4.44",
  "peft>=0.12",
  "trl>=0.10",
  "bitsandbytes>=0.43; platform_system=='Linux'",
  "datasets>=2.20",
  "accelerate>=0.33",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fineforge_train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
